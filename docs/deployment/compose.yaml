services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tpc
      POSTGRES_USER: tpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tpc -d tpc]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: loopback,linklocal,uniquelocal
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      DATABASE_URL: postgresql://tpc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/tpc
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:8080
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
